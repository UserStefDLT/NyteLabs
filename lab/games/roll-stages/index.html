    }
    .coin[data-active="true"] {

<script>
    const smap = {
        "h": 9,
        "w": 9,
    }
    const gamePhases = {
        currentPlayer: 1,
        coinsUsed: 3,
        player1coins: 3,
        player2coins: 3,
        player1tokens: 0,
        player2tokens: 0,

        z: false,
    }

    function randomVal(r = 10, b = 0){
        // let len = iconRow.length;
        // let index = Math.floor(Math.random()*len);
        // let val = iconRow[index];
        // return val;
        return Math.floor(Math.random()*r) + b;
    }
    function randomD6Val(r = 6, b = 1){
        return Math.floor(Math.random()*r) + b;
    }
    function roll1d(d = 6){
        return Math.floor(Math.random()*d) + 1;
    }
    function rollTheDice(d = 6, n = 1, b = 1){
        console.log("rollTheDice");
        let sum = 0
        for (let i = 0; i < n; i++) {
            let roll = roll1d(d);
            if(roll == d){addCoin();}
            sum += roll;
        }
        return sum;
    }

    function addCoin(){
        gamePhases[`player${gamePhases.currentPlayer}coins`]++;
        
        setTimeout(() => {
            let playerCoinCount = document.querySelector(`[data-playerCount="${gamePhases.currentPlayer}"]`);
            playerCoinCount.innerText = gamePhases[`player${gamePhases.currentPlayer}coins`];
        }, 100);
    }
    function reduceCoin(){
        if(gamePhases.coinsUsed > 0){
            gamePhases.coinsUsed--;
            gamePhases[`player${gamePhases.currentPlayer}coins`]--;
            
            setTimeout(() => {
                let playerCoinCount = document.querySelector(`[data-playerCount="${gamePhases.currentPlayer}"]`);
                playerCoinCount.innerText = gamePhases[`player${gamePhases.currentPlayer}coins`];
            }, 100);
        }
    }

    function CreateDisplayMap(w,h){
        let grid = document.createElement("div");
        grid.classList.add("grid");
        for (let y = 0; y < h; y++) {
            let row = document.createElement("div");
            row.classList.add("row");
            for (let x = 0; x < w; x++) {
                let tile = document.createElement("div");
                tile.classList.add("tile");
                tile.id = `y${y},x${x}`;

                
                // let val = randomVal();
                // let val = randomD6Val();
                let val = 0;

                tile.innerHTML = "";
                tile.dataset.val = "0";

                tile.dataset.val = val;
                // tile.style = `--val: ${val};`;
                // tile.style = `--hue: ${val*36};`;
                // tile.style = `--val: ${val}; --hue: ${val*36};`;
                tile.style = `--val: ${val}; --hue: ${val*60};`;

                // tile.dataset.yx = `${y},${x}`;
                tile.dataset.y = `${y}`;
                tile.dataset.x = `${x}`;
                // tile.dataset.selected = false;
                tile.dataset.hasACoin = false;
                tile.dataset.isTile = true;

                tile.addEventListener("click", ev => {
                    console.log(`tile id: ${ev.target.id}`);
                    // console.log(`tile id: ${ev.target.dataset.isTile}`);
                    // console.log(`tile id: ${ev.target.dataset.isTile == "true"}`);
                    // selectNumber(ev);
                    // resetNumber(ev.target.dataset.x,ev.target.dataset.y);
                    if(ev.target.dataset.isTile == "true"){
                        // console.log(`tile id: ${ev.target.id} - is a tile!`);
                        let targetTile = document.getElementById(ev.target.id);
                        if(targetTile.dataset.hasACoin != "true"){
                            // console.log(`tile id: ${ev.target.id} - has no coin!`);
                            PlaceCoin(ev.target.dataset.x,ev.target.dataset.y);
                        }
                    }
                });
                row.appendChild(tile);
            }
            grid.appendChild(row);
        }
        return grid;
    }

    function PlaceCoin(x,y){
        console.log("PlaceCoin")
        let tile = document.getElementById(`y${y},x${x}`);
        if(gamePhases.coinsUsed > 0){
            let coin = document.createElement("div");
            coin.classList.add("coin");
            coin.id = `p${gamePhases.currentPlayer}-c${gamePhases[`player${gamePhases.currentPlayer}tokens`]}`;
            coin.dataset.player = gamePhases.currentPlayer;
            coin.dataset.active = true;
            coin.addEventListener("click", ev => {
                console.log(`coin id: ${ev.target.id}`);
                // selectNumber(ev);
                // resetNumber(ev.target.dataset.x,ev.target.dataset.y);
                let token = document.getElementById(ev.target.id);
                console.log(token);
                if(token.dataset.active == "true"){
                    let roll = CoinFlip([1,0,0,0,0,0]);
                    console.log(roll);
                    token.innerText = roll;
                    token.dataset.active = false;
                }
            });

            // tile.innerHTML = `<div class="coin" data-active="true"></div>`;
            tile.appendChild(coin);
            gamePhases[`player${gamePhases.currentPlayer}tokens`]++;
            tile.dataset.hasACoin = true;
            // gamePhases.coinsUsed--;
            // gamePhases[`player${gamePhases.currentPlayer}coins`] -= 1;
            // let playerCoinCount = document.querySelector(`[data-player="${gamePhases.currentPlayer}"]`);
            // playerCoinCount.innerText = gamePhases[`player${gamePhases.currentPlayer}coins`];
            reduceCoin();
        }
    }

    function CoinFlip(ds = [1,0,0,0,0,0]){
        console.log("coinflip");
        let sum = 0;
        sum += rollTheDice(2,ds[0]);
        // sum += rollTheDice(4,ds[1]);
        // sum += rollTheDice(6,ds[2]);
        // sum += rollTheDice(8,ds[3]);
        // sum += rollTheDice(10,ds[4]);
        // sum += rollTheDice(12,ds[5]);
        return sum;
    }

    function resetNumber(x,y){
        let tile = document.getElementById(`y${y},x${x}`);
        let val = randomD6Val();
        tile.innerHTML = val;
        tile.dataset.val = val;
        tile.style = `--val: ${val}; --hue: ${val*60};`;
    }

    function NumbersInGrid(w,h){
        let display = document.getElementById("display");
        let grid = document.createElement("div");
        grid.classList.add("grid");
        for (let y = 0; y < h; y++) {
            let row = document.createElement("div");
            row.classList.add("row");
            for (let x = 0; x < w; x++) {
                let tile = document.createElement("div");
                tile.classList.add("tile");
                // let val = Math.floor(Math.random() * 6);
                let val = randomVal();
                // tile.innerText = val;
                tile.innerHTML = val;
                tile.dataset.val = val;
                // tile.dataset.val = iconVal[val];
        
                tile.id = `y${y},x${x}`;
                tile.dataset.yx = `${y},${x}`;
                tile.dataset.y = `${y}`;
                tile.dataset.x = `${x}`;
                tile.dataset.selected = false;
                tile.addEventListener("click", ev => {
                    selectNumber(ev);
                });
                row.appendChild(tile);
            }
            grid.appendChild(row);
        }
        display.appendChild(grid);
    }

    /* ─── Events ─── */
    function updateSettings(){
        s.h = window.innerHeight;
        s.w = window.innerWidth;
        s.dim = Math.sqrt(s.h * s.h + s.w * s.w);

        /* ─ Canvas ─ */
        s.canvas.x = s.w;
        s.canvas.y = s.h;
        s.canvas.z = (s.h + s.w)/2;

        s.canvas.x2 = s.canvas.x/2;
        s.canvas.y2 = s.canvas.y/2;
        s.canvas.z2 = s.canvas.z/2;

        /* ─ Box ─ */
        /* resize box for mobile */
        if(s.h < s.box.y) {s.box.y = s.h;}
        if(s.w < s.box.x) {s.box.x = s.w;}
        s.box.z = (s.box.y + s.box.x)/2;

        /* center box */
        s.box.top = (s.h - s.box.y)/2;
        s.box.left = (s.w - s.box.x)/2;

        /* determine center */
        s.box.x2 = s.box.left + (s.box.x / 2);
        s.box.y2 = s.box.top + (s.box.y / 2);
        s.box.z2 = (s.box.z / 2);

        /* ─ Grid ─ */
        s.grid.cols = Math.floor(s.w / s.tile.w);
        s.grid.rows = Math.floor(s.h / s.tile.h);

        /* ─ Canvas Update ─ */
        // canvas.width = s.canvas.x;
        // canvas.height = s.canvas.y;
        // ctx.clearRect(0,0,canvas.width, canvas.height);
    }
    window.addEventListener('resize', () =>{
        updateSettings();
    });

    window.addEventListener('load', (ev) => {
        console.log(`Welcome to my Lab!`);
        updateSettings();
        // start();
        // update();

        let display = document.getElementById("display");
        display.appendChild(CreateDisplayMap(smap.w,smap.h));
    });

</script>
