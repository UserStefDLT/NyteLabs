        FollowBug(s.mouse.x,s.mouse.y);

    function XYtoCSSAngle(x,y){
        let angle = 90;
        if(x == 0){
            if(y > 0) {return 180;}
            if(y < 0) {return 0;}
        }
        if(x < 0) { angle += 180; }
        if(y != 0) { angle += Math.atan(y/x) * 180 / Math.PI; }
        return angle;
    }
    var lbug = document.getElementById("lbug");
    function BugTracking(x,y){
        let ax = s.mouse.x - s.bug.x;
        let ay = s.mouse.y - s.bug.y;
        s.bug.a = XYtoCSSAngle(ax,ay);
        // console.log(`s.bug.a: ${s.bug.a}`);
        lbug.style = `--x: ${s.bug.x}px; --y: ${s.bug.y}px; --a: ${s.bug.a}deg;`;
    }
    function FollowBug(x,y){
        s.bug.f = true;
        let ax = s.mouse.x - s.bug.x;
        let ay = s.mouse.y - s.bug.y;
        console.log(`s.mouse.x: ${s.mouse.x} | s.mouse.y: ${s.mouse.y} |`);
        console.log(`s.bug.x: ${s.bug.x} | s.bug.y: ${s.bug.y} |`);
        s.bug.a = XYtoCSSAngle(ax,ay);
        console.log(`s.bug.a: ${s.bug.a}`);
        lbug.style = `--x: ${x}px; --y: ${y}px; --a: ${s.bug.a}deg;`;
        s.bug.x = x;
        s.bug.y = y;
        console.log(`s.bug.x: ${s.bug.x} | s.bug.y: ${s.bug.y} |`);
        
        setTimeout(() => {s.bug.f = false;}, 900);
    }


    /* ─── Events ─── */
    function updateSettings(){
        s.h = window.innerHeight;
        s.w = window.innerWidth;
        s.dim = Math.sqrt(s.h * s.h + s.w * s.w);

        /* ─ Canvas ─ */
        s.canvas.x = s.w;
        s.canvas.y = s.h;
        s.canvas.z = (s.h + s.w)/2;

        s.canvas.x2 = s.canvas.x/2;
        s.canvas.y2 = s.canvas.y/2;
        s.canvas.z2 = s.canvas.z/2;

        /* ─ Box ─ */
        /* resize box for mobile */
        if(s.h < s.box.y) {s.box.y = s.h;}
        if(s.w < s.box.x) {s.box.x = s.w;}
        s.box.z = (s.box.y + s.box.x)/2;

        /* center box */
        s.box.top = (s.h - s.box.y)/2;
        s.box.left = (s.w - s.box.x)/2;

        /* determine center */
        s.box.x2 = s.box.left + (s.box.x / 2);
        s.box.y2 = s.box.top + (s.box.y / 2);
        s.box.z2 = (s.box.z / 2);

        /* ─ Grid ─ */
        s.grid.cols = Math.floor(s.w / s.tile.w);
        s.grid.rows = Math.floor(s.h / s.tile.h);

        /* ─ Canvas Update ─ */
        // canvas.width = s.canvas.x;
        // canvas.height = s.canvas.y;
        // ctx.clearRect(0,0,canvas.width, canvas.height);
    }
    window.addEventListener('resize', () =>{
        updateSettings();
    });


    window.addEventListener('load', (ev) => {
        console.log(`Welcome to my Lab!`);
        updateSettings();
        // start();
        // update();

        s.mouse.x = s.w/2;
        s.mouse.y = s.h/2;
        
        s.bug.x = s.w/2;
        s.bug.y = s.h/2;

    });
