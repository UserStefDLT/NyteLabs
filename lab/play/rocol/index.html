<script src="../../../scripts/settings-02.js"></script>
<script>
    const rotypes = ["","single","cross","x"];
    var smap = {
        h: 9,
        w: 9,
        len: 9,
        rotype: "single",
        z: false
    }
    var map = [];

    function selectRotypeSingle(){
        let previousBtn = document.getElementById(`${smap.rotype}Btn`); 
        previousBtn.classList.toggle("btn-selected");
        smap.rotype = "single"; 
        let btn = document.getElementById(`singleBtn`); 
        btn.classList.toggle("btn-selected");
    }
    function selectRotypeCross(){
        let previousBtn = document.getElementById(`${smap.rotype}Btn`); 
        previousBtn.classList.toggle("btn-selected");
        smap.rotype = "cross"; 
        let btn = document.getElementById(`crossBtn`); 
        btn.classList.toggle("btn-selected");
    }
    function selectRotypeX(){
        let previousBtn = document.getElementById(`${smap.rotype}Btn`); 
        previousBtn.classList.toggle("btn-selected");
        smap.rotype = "x"; 
        let btn = document.getElementById(`xBtn`); 
        btn.classList.toggle("btn-selected");
    }

    function makeMap(w,h,val = 0){
        let m = [];
        for (let y = 0; y < h; y++) {
            m.push([]);
            for (let x = 0; x < w; x++) {
                m[y].push(0);
            }
        }
        return m;
    }

    function randomVal(r = 10, b = 0){
        // let len = iconRow.length;
        // let index = Math.floor(Math.random()*len);
        // let val = iconRow[index];
        // return val;
        return Math.floor(Math.random()*r) + b;
    }

    function CreateDisplayMap(w,h){
        let grid = document.createElement("div");
        grid.classList.add("grid");
        for (let y = 0; y < h; y++) {
            let row = document.createElement("div");
            row.classList.add("row");
            for (let x = 0; x < w; x++) {
                let tile = document.createElement("div");
                tile.classList.add("tile");
                tile.id = `y${y},x${x}`;

                
                // let val = randomVal();
                let val = map[y][x];
                tile.innerHTML = val;
                tile.dataset.val = val;

                // tile.dataset.yx = `${y},${x}`;
                tile.dataset.y = `${y}`;
                tile.dataset.x = `${x}`;
                // tile.dataset.selected = false;

                tile.style = `--hue: ${val};`;

                tile.addEventListener("click", ev => {
                    console.log(`target id: ${ev.target.id}`);
                    // selectNumber(ev);
                    // resetNumber(ev.target.dataset.x,ev.target.dataset.y);

                    // RotateColorR(ev.target.dataset.x,ev.target.dataset.y);
                    // RotateColorCross(ev.target.dataset.x,ev.target.dataset.y);
                    RotateColorTypes(ev.target.dataset.x,ev.target.dataset.y);
                });
                row.appendChild(tile);
            }
            grid.appendChild(row);
        }
        return grid;
    }
    function RotateColorR(x,y){
        map[y][x] += 60;
        if(map[y][x] >= 360){map[y][x] = map[y][x]%360;}

        let tile = document.getElementById(`y${y},x${x}`);
        let val = map[y][x];
        tile.innerHTML = val;
        tile.style = `--hue: ${val};`;
    }
    function RotateColorL(x,y){
        map[y][x] -= 60;
        if(map[y][x] < 0){map[y][x] += 360;}

        let tile = document.getElementById(`y${y},x${x}`);
        let val = map[y][x];
        tile.innerHTML = val;
        tile.style = `--hue: ${val};`;
    }
    function RotateSingleTile(x,y){}
    function RotateColorCross(x,y){
        for (let row = 0; row < smap.h; row++) {
            // map[row][x]
            RotateColorR(x,row);
        }
        for (let col = 0; col < smap.w; col++) {
            // map[row][x]
            RotateColorR(col,y);
        }
        RotateColorL(x,y);
    }
    function IsInMap(x,y){
        return (x < smap.w && y < smap.h && x >= 0 && y >= 0);
    }
    // function RotateColorX_helper(x,y,step){}
    function RotateColorX(xid,yid){
        let x = parseInt(xid);
        let y = parseInt(yid);
        for (let i3 = 1; i3 < smap.len; i3++) {
            let nx = x + i3;
            let ny = y + i3;
            if(IsInMap(nx,ny)){
                RotateColorR(nx,ny);
            } else {i3 = smap.len;}
        }
        for (let i1 = 1; i1 < smap.len; i1++) {
            let nx = x - i1;
            let ny = y + i1;
            if(IsInMap(nx,ny)){
                RotateColorR(nx,ny);
            } else {i1 = smap.len;}
        }

        for (let i9 = 1; i9 < smap.len; i9++) {
            let nx = x + i9;
            let ny = y - i9;
            if(IsInMap(nx,ny)){
                RotateColorR(nx,ny);
            } else {i9 = smap.len;}
        }
        for (let i7 = 1; i7 < smap.len; i7++) {
            let nx = x - i7;
            let ny = y - i7;
            if(IsInMap(nx,ny)){
                RotateColorR(nx,ny);
            } else {i7 = smap.len;}
        }
        RotateColorR(x,y);
    }
    function RotateColorTypes(x,y){
        switch (smap.rotype) {
            case "single":
                RotateColorR(x,y);
                break;
            case "cross":
                RotateColorCross(x,y);
                break;
            case "x":
                RotateColorX(x,y);
                break;
            default:
        }
    }

    function resetNumber(x,y){
        let tile = document.getElementById(`y${y},x${x}`);
        let val = randomVal();
        tile.innerHTML = val;
        tile.dataset.val = val;
    }

    function NumbersInGrid(w,h){
        let display = document.getElementById("display");
        let grid = document.createElement("div");
        grid.classList.add("grid");
        for (let y = 0; y < h; y++) {
            let row = document.createElement("div");
            row.classList.add("row");
            for (let x = 0; x < w; x++) {
                let tile = document.createElement("div");
                tile.classList.add("tile");
                // let val = Math.floor(Math.random() * 6);
                let val = randomVal();
                // tile.innerText = val;
                tile.innerHTML = val;
                tile.dataset.val = val;
                // tile.dataset.val = iconVal[val];
        
                tile.id = `y${y},x${x}`;
                tile.dataset.yx = `${y},${x}`;
                tile.dataset.y = `${y}`;
                tile.dataset.x = `${x}`;
                tile.dataset.selected = false;
                tile.addEventListener("click", ev => {
                    selectNumber(ev);
                });
                row.appendChild(tile);
            }
            grid.appendChild(row);
        }
        display.appendChild(grid);
    }

    /* ─── Events ─── */
    function updateSettings(){
        s.h = window.innerHeight;
        s.w = window.innerWidth;
        s.dim = Math.sqrt(s.h * s.h + s.w * s.w);

        /* ─ Canvas ─ */
        s.canvas.x = s.w;
        s.canvas.y = s.h;
        s.canvas.z = (s.h + s.w)/2;

        s.canvas.x2 = s.canvas.x/2;
        s.canvas.y2 = s.canvas.y/2;
        s.canvas.z2 = s.canvas.z/2;

        /* ─ Box ─ */
        /* resize box for mobile */
        if(s.h < s.box.y) {s.box.y = s.h;}
        if(s.w < s.box.x) {s.box.x = s.w;}
        s.box.z = (s.box.y + s.box.x)/2;

        /* center box */
        s.box.top = (s.h - s.box.y)/2;
        s.box.left = (s.w - s.box.x)/2;

        /* determine center */
        s.box.x2 = s.box.left + (s.box.x / 2);
        s.box.y2 = s.box.top + (s.box.y / 2);
        s.box.z2 = (s.box.z / 2);

        /* ─ Grid ─ */
        s.grid.cols = Math.floor(s.w / s.tile.w);
        s.grid.rows = Math.floor(s.h / s.tile.h);

        /* ─ Canvas Update ─ */
        // canvas.width = s.canvas.x;
        // canvas.height = s.canvas.y;
        // ctx.clearRect(0,0,canvas.width, canvas.height);
    }
    window.addEventListener('resize', () =>{
        updateSettings();
    });

    window.addEventListener('load', (ev) => {
        console.log(`Welcome to my Lab!`);
        updateSettings();
        // start();
        // update();

        map = makeMap(smap.w, smap.h);
        let display = document.getElementById("display");
        display.appendChild(CreateDisplayMap(smap.w,smap.h));
    });

    [index-nds-00]: Default Template.

    [index-nds-11]: 
    [index-nds-12]: 
    
    */


</script>
