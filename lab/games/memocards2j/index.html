            --j2i: 0;

            --card-bg-02: radial-gradient(circle at 50% 50%, #700 50%, #0000 50%) 10px 10px / 100px 100px no-repeat, linear-gradient(135deg, #fff5 50%, #0002 50%), #aaa;

        }
        main {margin-top: 8vmin;}
        .board {
            grid-template-columns: repeat(10, 1fr);
            grid-template-columns: repeat(5, 1fr);
            grid-template-columns: repeat(4, 1fr);
        }
        .card {
            height: 100px; width: 100px;
            height: 60px; width: 60px;
            height: 70px; width: 70px;
            margin: 4px;
            
            height: 80px; width: 80px;
            /* height: 100px; width: 100px; */
            margin: 8px;
            font-size: 32px;
            font-size: 16px;
            --hue: calc(var(--j2i) * 240);
            /* --hue: calc(var(--j2i) * 90); */
            color: hsla(var(--hue), 100%, 50%, 1);
            color: hsla(var(--hue), 65%, 35%, 1);
        }
        .card::before {
            background: var(--card-bg-02);
        }
        /* .card-p {font-size: 32px;}
        .card-q {font-size: 32px;} */

        .card::after {
            content: attr(data-listid);
            align-items: flex-start;
            justify-content: flex-start;
            color: #f00;
            opacity: 0;
        }

        .board::after {content: "🎊 ¡Ganaste! ㊗ 🎉"; }

        /* #CheckboxID-02, */
        #toggleCard-help {display: none;}
        /* #CheckboxID-02:checked ~ .options .toggleCheckboxLabel[for="CheckboxID-02"], */
        #toggleCard-help:checked ~ .options .toggleCheckboxLabel[for="toggleCard-help"] {
            color: var(--bwe);
            --clr-outline: var(--bwc);
            --bgc-before: #063;
            --bgc-after: #0c6;
            --ttx-after: 1rem;
        }
        #toggleCard-help:checked ~ main .card::after {
            opacity: .2;
        }

var cardAid = "";

var secondClick = false;
var cardCount = 16;

function Match(aid,bid){
    let cardA = document.getElementById(aid);
    let cardB = document.getElementById(bid);
    cardA.classList.add("gold-spin");
    cardB.classList.add("gold-spin");
    setTimeout(() => {
        cardA.classList.add("a0");
        cardB.classList.add("a0");
    }, 2000);
}
function NotAMatch(aid,bid){
    let cardA = document.getElementById(aid);
    let cardB = document.getElementById(bid);
    cardA.classList.toggle("selected");
    cardB.classList.toggle("selected");
    cardA.classList.add("wrong-card");
    cardB.classList.add("wrong-card");
    setTimeout(() => {
        cardA.classList.toggle("wrong-card");
        cardB.classList.toggle("wrong-card");
    }, 1000);
}
function ClickCard(cid){
    // console.log(`ClickCard event: ${cid}`);
    let clickid = cid;
    let clickedElement = document.getElementById(clickid);
    if(clickid != cardAid){
        if(secondClick){
            cardBid = clickid;
            let aid = document.getElementById(cardAid).dataset.pairid;
            let bid = document.getElementById(cardBid).dataset.pairid;
            if(aid == bid) {
            cardCount -= 2;
            Match(cardAid,cardBid);
            if(cardCount == 0) {EndGame();}
            } else {
            NotAMatch(cardAid,cardBid);
            }
        } else {
            cardAid = clickid;
        }
        // secondClick = secondClick ? false : true;
    } else {
        cardAid = "";
    }
    clickedElement.classList.toggle("selected");
    secondClick = secondClick ? false : true;
}

function rint(r){
return Math.floor(Math.random() * r);
}
function rint1(r){
return Math.floor(Math.random() * r) + 1;
}
function AddCard(){
    let a = Math.floor(Math.random() * 10);
    let b = Math.floor(Math.random() * 10);
    let c = a + b;
    return {"q": `${a} + ${b}`, "p": `${c}`};
}
function MakeAddPairs(amount = 1){
    for (let i = 0; i < amount; i++) {
        cards["add"].push(AddCard());
    }
}
const math_op = [`+`, `-`, `*`, `/`];
function MathCard(op, n){
    // let mop = math_op[rint(math_op.length)];
    let a = rint1(n);
    let b = rint1(n);
    let c = eval(`${a} ${op} ${b}`);

    return {"q": `${a} ${op} ${b}`, "p": `${c}`};
}
function MakeMathPairs(amount = 1){
    for (let i = 0; i < amount; i++) {
        cards["math"].push(MathCard());
    }
}

function OpCard(){
    let op = opps[rint(opps.length)];
    let a = rint1(10);
    let b = rint1(10);
    let c = eval(`${a} ${op} ${b}`);

    return {"q": `${a} ? ${b} = ${c}`, "p": `${op}`};
}
function MakeOppPairs(amount = 1){
    for (let i = 0; i < amount; i++) {
        cards["opp"].push(OpCard());    
    }
}

function sortCards(){
    let board = document.getElementById('board');
    let cards = document.querySelectorAll(".card");
    let len = cards.length;
    for (let i = 0; i < len; i++) {
        let ri = Math.floor(Math.random() * len);
        const e = cards[ri];
        board.appendChild(e);
    }
}
function sortCards2(){
    let board = document.getElementById('board');
    let qcards = document.querySelectorAll(".card-q");
    for (let i = 0; i < qcards.length; i++) {
        board.appendChild(qcards[i]);
    }
}

function DeckStart(deckType){
    settings["deck-size"] = settings["n-of-pairs"] * 2;
    cardCount = settings["n-of-pairs"] * 2;
    switch (deckType) {
        case "add": 
            settings["deck"] = "add";
            cards["add"] = [];
            MakeAddPairs(settings["n-of-pairs"]);
            // DisplayCards(cards["add"]);
            break;
        case "opp": 
            settings["deck"] = "opp";
            cards["opp"] = [];
            MakeOppPairs(settings["n-of-pairs"]);
            // DisplayCards(cards["add"]);
            break;
        default:
            settings["deck"] = deckType;
            break;
    }
    DisplayNCards(cards[settings["deck"]], settings["n-of-pairs"]);
    // DisplayNCodeCards(cards[settings["deck"]], settings["n-of-pairs"]);
    sortCards();
}

function restart(){
    secondClick = false;
    let board = document.getElementById('board');
    board.innerHTML = "";

    DeckStart(settings["deck"]);

    setTimeout(() => {
        board.style = "transform: perspective(1000px) rotate3d(0,1,0,0deg);";
    }, 200);
}
