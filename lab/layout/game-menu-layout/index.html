    <style>
        .list {
            max-width: max(370px, 48vw);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            flex-wrap: wrap;
            background: #fff;
            color: #222;
            min-width: 300px;
        }

        .sample {
            --hue: calc(var(--i) * 60);
            background-color: hsla(var(--hue), 100%, 60%, 1);
            margin: .125rem .25rem;
            padding: 8px 12px;
            font-size: 16px;
            color: black;
            border-radius: .25rem;
        }

        .bar,
        .game-choices,
        .a,
        .b,
        .c,
        .d,
        .about,
        .nytelabs {
            display: flex;
            align-items: center;
            justify-content: center;

        }

        .bar {
            box-sizing: border-box;
            width: 100%;
            background: #ccc;
            justify-content: flex-start;
            flex-direction: row;
            padding-left: 8px;
        }

        .sandwitch {
            height: 32px;
            width: 40px;
            background-color: #5550;
            margin: 8px 0;
            background-image: linear-gradient(#555 0%, #555 20%,
                    #5550 20%, #5550 40%,
                    #555 40%, #555 60%,
                    #5550 60%, #5550 80%,
                    #555 80%, #555 100%);
            transform: scale(.75);
        }

        .game-choices {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: row;
            flex-wrap: wrap;
            height: 150px;
            width: 200px;
            background: #fff;

            grid-template:
                "a a b" 40px
                "c d d" 40px / 1fr 1fr 1fr;
            margin: 12px 0;

        }

        .a,
        .b,
        .c,
        .d,
        .about,
        .nytelabs {
            height: 50px;
            width: 50px;
            outline: 1px solid #333;
            border-radius: 4px;
            box-shadow: 0px 4px 2px -2px #3333;
            box-shadow: 0px 3px 1px -1px #3339;
            transform: translateY(0px);
            margin: 12px;
            cursor: pointer;
            transition: transform 200ms ease-in-out, box-shadow 200ms ease-in-out;
        }

        .a,
        .d,
        .nytelabs {
            width: 100px;
        }

        .a {
            grid-area: a;
        }

        .b {
            grid-area: b;
        }

        .c {
            grid-area: c;
        }

        .d {
            grid-area: d;
        }

        .game-choices>div:hover,
        .other>div:hover {
            transform: translateY(-2px);
            box-shadow: 0px 5px 2px -2px #3339;

            transform: translateY(-4px);
            box-shadow: 0px 9px 3px -3px #3339;

            transform: translateY(-4px);
            box-shadow: 0px 10px 4px -4px #3338;
        }

        .about,
        .nytelabs {
            outline: 1px solid #3336;
        }

        .other {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: row;
            height: 100px;
        }
    </style>

    <script>



        /* ─── Events ─── */
        function updateSettings() {
            s.h = window.innerHeight;
            s.w = window.innerWidth;
            s.dim = Math.sqrt(s.h * s.h + s.w * s.w);

            /* ─ Canvas ─ */
            s.canvas.x = s.w;
            s.canvas.y = s.h;
            s.canvas.z = (s.h + s.w) / 2;

            s.canvas.x2 = s.canvas.x / 2;
            s.canvas.y2 = s.canvas.y / 2;
            s.canvas.z2 = s.canvas.z / 2;

            /* ─ Box ─ */
            /* resize box for mobile */
            if (s.h < s.box.y) { s.box.y = s.h; }
            if (s.w < s.box.x) { s.box.x = s.w; }
            s.box.z = (s.box.y + s.box.x) / 2;

            /* center box */
            s.box.top = (s.h - s.box.y) / 2;
            s.box.left = (s.w - s.box.x) / 2;

            /* determine center */
            s.box.x2 = s.box.left + (s.box.x / 2);
            s.box.y2 = s.box.top + (s.box.y / 2);
            s.box.z2 = (s.box.z / 2);

            /* ─ Grid ─ */
            s.grid.cols = Math.floor(s.w / s.tile.w);
            s.grid.rows = Math.floor(s.h / s.tile.h);

            /* ─ Canvas Update ─ */
            // canvas.width = s.canvas.x;
            // canvas.height = s.canvas.y;
            // ctx.clearRect(0,0,canvas.width, canvas.height);
        }
        window.addEventListener('resize', () => {
            updateSettings();
