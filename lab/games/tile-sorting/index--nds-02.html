<script>

function TileMove(x,y,dx,dy){
    let tile = document.getElementById(`t,y${y},x${x}`);

    tile.dataset.id = `t,y${y},x${x}`;

    let tilex = tile.dataset.x;
    let tiley = tile.dataset.y;

    tile.dataset.x += dx;
    tile.dataset.y += dy;

    tile.style = `--hue: ${tile.dataset.hue}; --x: ${tile.dataset.x}; --y: ${tile.dataset.y};`;

}

function TileRowSlide(y,dx=1){
    let rowTiles = document.querySelectorAll(`[data-y="${y}"]`);
    // rowTiles;
    for (let i = 0; i < rowTiles.length; i++) {
        const tile = rowTiles[i];
        tile.dataset.x = parseInt(tile.dataset.x) + dx;
        if(tile.dataset.x >= sg.xlen) {tile.dataset.x = 0;}
        if(tile.dataset.x < 0) {tile.dataset.x = sg.xlen - 1;}
        // tile.style = `--hue: ${tile.dataset.hue}; --x: ${tile.dataset.x}; --y: ${tile.dataset.y};`;
        tile.style = `--hue: ${tile.dataset.hue}; --huex: ${tile.dataset.huex}; --huey: ${tile.dataset.huey}; --x: ${tile.dataset.x}; --y: ${tile.dataset.y};`;
    }
}
function TileColSlide(x,dy=1){
    let colTiles = document.querySelectorAll(`[data-x="${x}"]`);
    for (let i = 0; i < colTiles.length; i++) {
        const tile = colTiles[i];
        tile.dataset.y = parseInt(tile.dataset.y) + dy;
        if(tile.dataset.y >= sg.ylen) {tile.dataset.y = 0;}
        if(tile.dataset.y < 0) {tile.dataset.y = sg.ylen - 1;}
        tile.style = `--hue: ${tile.dataset.hue}; --huex: ${tile.dataset.huex}; --huey: ${tile.dataset.huey}; --x: ${tile.dataset.x}; --y: ${tile.dataset.y};`;
    }
}


function MakeGrid(xlen,ylen){
    let grid = document.createElement("div");
    grid.classList.add("grid");
    grid.style = `--xlen: ${xlen}; --ylen: ${ylen};`;
    for (let y = 0; y < ylen; y++) {
        // let row = document.createElement("div");
        // row.classList.add("row");
        for (let x = 0; x < xlen; x++) {
            let tile = document.createElement("div");
            tile.classList.add("tile");
            tile.id = `t,y${y},x${x}`;
            tile.dataset.x = x;
            tile.dataset.y = y;
            // xoff = x * s.tile.offsz;
            // yoff = y * s.tile.offsz;
            tile.dataset.hue = (y * ylen + x) * 5;
            tile.dataset.hue = (y * ylen + x);
            tile.dataset.huex = x;
            tile.dataset.huey = y;
            // tile.style = `--hue: ${tile.dataset.hue}; --xoff: ${xoff}px; --yoff: ${yoff}px;`;
            tile.style = `--hue: ${tile.dataset.hue}; --x: ${x}; --y: ${y};`;
            // tile.style = `--hue: ${tile.dataset.hue}; --x: ${tile.dataset.x}; --y: ${tile.dataset.y};`;
            tile.style = `--hue: ${tile.dataset.hue}; --huex: ${tile.dataset.huex}; --huey: ${tile.dataset.huey}; --x: ${tile.dataset.x}; --y: ${tile.dataset.y};`;
            tile.innerText = `${y},${x}`;

            grid.appendChild(tile);
        }
    }
    return grid;
}


function MoveSelector(x,y) {
    sg.currentTile.x += x;
    if(sg.currentTile.x >= sg.xlen) {sg.currentTile.x = 0;}
    if(sg.currentTile.x < 0) {sg.currentTile.x = sg.xlen - 1;}
    
    sg.currentTile.y += y;
    if(sg.currentTile.y >= sg.ylen) {sg.currentTile.y = 0;}
    if(sg.currentTile.y < 0) {sg.currentTile.y = sg.ylen - 1;}

    // let gridDisplay = document.getElementById("gridDisplay");
    let gridDisplay = document.getElementById("display");
    gridDisplay.style = `--currenX: ${sg.currentTile.x}; --currenY: ${sg.currentTile.y};`;
}
window.addEventListener("keydown", function (event) {
    // if(event.key == 'Escape') {q();}
    // if(s.q){console.log(`→ %ckey: %c${event.key}%c | keyCode: %c${event.keyCode}`, logSty.c, logSty.keyStyle, logSty.c, logSty.keyCodeStyle);}
    if(!s.q){
        // if(event.key == ' ' || event.key == 'Enter') {pause();}
        // if(event.key == '`') {openS();}
        // if(event.key == 'CapsLock') {lockKeys();}
        // if(event.key == 'CapsLock') {s.lockKeys = !s.lockKeys;}
        if(!s.lockKeys){
            // if(event.key == 'l' || event.key == 'L') {toggleLog();}
            // if(event.key == 'i' || event.key == 'I') {toggleTags();}
            if(event.key == 'w' || event.key == 'W') {MoveSelector(0,-1)}
            if(event.key == 's' || event.key == 'S') {MoveSelector(0,1)}
            if(event.key == 'a' || event.key == 'A') {MoveSelector(-1,0)}
            if(event.key == 'd' || event.key == 'D') {MoveSelector(1,0)}

            if(event.key == 'ArrowUp') {TileColSlide(sg.currentTile.x,-1)}
            if(event.key == 'ArrowDown') {TileColSlide(sg.currentTile.x,1)}
            if(event.key == 'ArrowLeft') {TileRowSlide(sg.currentTile.y,-1)}
            if(event.key == 'ArrowRight') {TileRowSlide(sg.currentTile.y,1)}
        }
    }
});

    /* ─── Events ─── */
    function updateSettings(){
        s.h = window.innerHeight;
        s.w = window.innerWidth;
        s.dim = Math.sqrt(s.h * s.h + s.w * s.w);

        /* ─ Canvas ─ */
        s.canvas.x = s.w;
        s.canvas.y = s.h;
        s.canvas.z = (s.h + s.w)/2;

        s.canvas.x2 = s.canvas.x/2;
        s.canvas.y2 = s.canvas.y/2;
        s.canvas.z2 = s.canvas.z/2;

        /* ─ Box ─ */
        /* resize box for mobile */
        if(s.h < s.box.y) {s.box.y = s.h;}
        if(s.w < s.box.x) {s.box.x = s.w;}
        s.box.z = (s.box.y + s.box.x)/2;

        /* center box */
        s.box.top = (s.h - s.box.y)/2;
        s.box.left = (s.w - s.box.x)/2;

        /* determine center */
        s.box.x2 = s.box.left + (s.box.x / 2);
        s.box.y2 = s.box.top + (s.box.y / 2);
        s.box.z2 = (s.box.z / 2);

        /* ─ Grid ─ */
        s.grid.cols = Math.floor(s.w / s.tile.w);
        s.grid.rows = Math.floor(s.h / s.tile.h);

        /* ─ Canvas Update ─ */
        // canvas.width = s.canvas.x;
        // canvas.height = s.canvas.y;
        // ctx.clearRect(0,0,canvas.width, canvas.height);
    }
    window.addEventListener('resize', () =>{
        updateSettings();
    });
