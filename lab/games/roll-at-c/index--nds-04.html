<style>
    :root {
        --sz-tile: 300px;
        --sz-tile: 100px; /* it works best on multiples of 4. */
        --sz-tile: 40px;
        --sz2-tile: calc(var(--sz-tile) / 2);
        --borrad: calc(var(--sz-tile) / 5);

        --rotate-x: 0deg;
        --rotate-y: 0deg;
        --rotate-z: 0deg;
    }
    .class {}
    #display {
        transform: rotate3d(0, 0, 0, 54deg) rotateZ(0deg);
        transform: rotate3d(1, 1, 0, .01deg) rotateZ(0deg);
        transform-style: preserve-3d;
        transition: transform 300ms ease-in-out;
    }
    .grid, .row, .tile, .side {
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        transform-style: preserve-3d;
    }
    .grid {
        background-color: #ddd0;
    }
    .row {
        --y-row: var(--i);
        /* --y-row: calc(var(--i) - 15); */
        flex-direction: row;
    }
    .tile {
        --x-col: var(--i);
        /* --x-col: calc(var(--i) - 15); */
        --xy: calc(var(--x-col) + var(--y-row));
        --xy-delay: calc(var(--xy) * 30ms + 10ms);
        --xy-delay: calc(var(--xy) * 1ms);
        /* --xy: calc(var(--x-col) * var(--y-row));
        --xy-delay: calc(2550ms - var(--xy) * 10ms);
        --xy-delay: calc(var(--xy) * -10ms + 2500ms); */
        --rotate-x: 0deg;
        --rotate-y: 0deg;
        --hue: 210;
        position: relative;
        /* box-sizing: border-box; */
        background-color: #ddd0;
        /* background-image: linear-gradient(hsla(var(--hue), 100%, 60%, 1), hsla(var(--hue), 100%, 30%, 1)); */
        /* background-image: linear-gradient(hsla(var(--hue), 50%, 70%, 1), hsla(var(--hue), 80%, 70%, 1)); */
        /* background-image: repeating-conic-gradient(#0008 0deg 90deg, #fff8 90deg 180deg); */
        color: #222;
        height: 20px; width: 20px;
        height: var(--sz-tile); width: var(--sz-tile);
        user-select: none;
        cursor: pointer;
        /* outline: 1px dashed #2220;
        outline-offset: -2px;
        border-radius: 6px;
        border-radius: var(--borrad); */
        margin: 1px;
        margin: 0px;
        transform: translateY(0px) translatex(90px) rotate3d(1, 1, -1, 50deg);
        transform: translateY(0px) rotate3d(0,0,0,90deg);
        transform: rotateX(var(--rotate-x)) rotateY(var(--rotate-y));
        transform: rotateX(var(--rotate-x)) rotateY(var(--rotate-y)) rotateZ(var(--rotate-z));
        transform-style: preserve-3d;
        transition: transform 200ms ease-in-out;
        transition-delay: var(--xy-delay);
    }
    /* .tile:hover {outline: 1px dashed #2228;} */

    .side {
        position: absolute;
        background-image: linear-gradient(hsla(var(--hue), 50%, 70%, 1), hsla(var(--hue), 80%, 70%, 1));
        color: hsla(var(--hue), 100%, 20%, 1);
        
        background-image: linear-gradient(hsla(130, 50%, 70%, 1), hsla(130, 80%, 70%, 1));
        color: hsla(210, 100%, 20%, 1);

        background-image: linear-gradient(#000 45%, #fff 45%, #fff 55%, #000 55%);
        background-image: 
        linear-gradient(90deg, #0000 45%, #fff 45%, #fff 55%, #0000 55%), 
        linear-gradient(#0000 45%, #fff 45%, #fff 55%, #0000 55%), 
        linear-gradient(hsla(130, 50%, 70%, 1), hsla(130, 80%, 70%, 1));
        background-image: 
        linear-gradient(90deg, #0000 44%, #f00 44%, #f00 56%, #0000 56%), 
        linear-gradient(#0000 44%, #0f0 44%, #0f0 56%, #0000 56%), 
        linear-gradient(hsla(180, 100%, 0%, 1), hsla(180, 80%, 0%, 1));
        background-image: 
        linear-gradient(90deg, #0000 43%, #f00 43%, #f00 57%, #0000 57%), 
        linear-gradient(#0000 43%, #0f0 43%, #0f0 57%, #0000 57%), 
        linear-gradient(hsla(180, 100%, 0%, 1), hsla(180, 80%, 0%, 1));

        background-image: linear-gradient(hsla(210, 50%, 80%, 1), hsla(210, 50%, 80%, 1));
        color: hsla(210, 100%, 20%, 1);


        height: var(--sz-tile); width: var(--sz-tile);
        outline: 1px dashed #2220;
        outline-offset: -2px;
        /* border-radius: 6px;
        border-radius: var(--borrad); */
        border-radius: 0px;
        transform-origin: 50% 50% -10px;
        transform-origin: 50% 50% -5px;
        transform-origin: 50% 50% 0px;
        transform-style: preserve-3d;
        backface-visibility: hidden;
        font-size: calc(var(--sz-tile) * 1.4);
        overflow: hidden;
    }
    .side:hover {
        outline: 1px dashed hsla(var(--hue), 100%, 20%, 1);
    }
    .side-1 {transform: rotate3d(0,0,0,90deg) translateZ(var(--sz2-tile));}
    .side-2 {transform: rotate3d(-1,0,0,90deg) translateZ(var(--sz2-tile));}
    .side-3 {transform: rotate3d(0,1,0,90deg) translateZ(var(--sz2-tile));}
    .side-4 {transform: rotate3d(0,-1,0,90deg) translateZ(var(--sz2-tile));}
    .side-5 {transform: rotate3d(1,0,0,90deg) translateZ(var(--sz2-tile));}
    .side-6 {transform: rotate3d(1,0,0,180deg) translateZ(var(--sz2-tile));}
    .dice-number {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        opacity: 0;
    }
    .dice-path {
        position: absolute;
        top: 50%; left: 50%;
        top: 42.5%; left: 50%;
        transform: translate(-50%, -50%);
    }

    .btn-free {
        background-color: #0000;
        border: 0px solid #0000;
        font-size: 16px;
    }
    .btn-free:hover {
        outline: 1px dashed #fff8;
        outline-offset: 0px;
        border-radius: 4px;
    }

<script>
    const smap = {
        "h": 15,
        "w": 15,
    }
    const side_char2 = ["0","╦","╬","╗","╔","╨","║"];
    const side_char1 = ["0","┬","┼","┐","┌","╧","│","│─└┴┘├┼┤┌┬┐"];
    const side_char = ["0","╦","╬","╗","╔","╨","║"];
    const sides = [1,2,3,4,5,6];
    const side_angle = [
        {x: 0, y: 0},
        {x: 0, y: 0},
        {x: 90, y: 0},
        {x: 0, y: -90},
        {x: 0, y: 90},
        {x: -90, y: 0},
        {x: 180, y: 0},
        {x: 0, y: 0}
    ]

    function randomVal(r = 10, b = 0){
        // let len = iconRow.length;
        // let index = Math.floor(Math.random()*len);
        // let val = iconRow[index];
        // return val;
        return Math.floor(Math.random()*r) + b;
    }
    function randomD6Val(r = 6, b = 1){
        return Math.floor(Math.random()*r) + b;
    }
    function roll1d(d = 6){
        return Math.floor(Math.random()*d) + 1;
    }
    function rollTheDice(d = 6, n = 1, b = 1){
        let sum = 0
        for (let i = 0; i < n; i++) {
            sum += roll1d(d);
        }
        return sum;
    }

    function CreateDisplayMap(w,h){
        let grid = document.createElement("div");
        grid.classList.add("grid");
        for (let y = 0; y < h; y++) {
            let row = document.createElement("div");
            row.classList.add("row");
            for (let x = 0; x < w; x++) {
                let tile = document.createElement("div");
                tile.classList.add("tile");
                tile.id = `y${y},x${x}`;

                
                // // let val = randomVal();
                let val = randomD6Val();
                // tile.innerHTML = val;
                tile.dataset.val = val;
                // // tile.style = `--val: ${val};`;
                // // tile.style = `--hue: ${val*36};`;
                // // tile.style = `--val: ${val}; --hue: ${val*36};`;
                // tile.style = `--val: ${val}; --hue: ${val*60};`;
                tile.style = ` --rotate-x: ${side_angle[val].x}deg; --rotate-y: ${side_angle[val].y}deg; --rotate-z: 0deg;`;

                // tile.dataset.yx = `${y},${x}`;
                // tile.dataset.id = `y${y},x${x}`;
                tile.dataset.y = `${y}`;
                tile.dataset.x = `${x}`;
                // tile.dataset.selected = false;
                tile.dataset.zr = `0`;
                tile.dataset.yr = `${side_angle[val].y}`;
                tile.dataset.xr = `${side_angle[val].x}`;

                tile.addEventListener("click", ev => {
                    console.log(`target id: ${ev.target.parentElement.id}`);
                    // console.log(`target id: ${ev.target.parentElement.id}, val: ${ev.target.parentElement.dataset.val};`);
                    // selectNumber(ev);
                    resetNumber(ev.target.parentElement.dataset.x,ev.target.parentElement.dataset.y);
                });

                for (let i = 0; i < sides.length; i++) {
                    const si = sides[i];
                    let side = document.createElement("div");
                    side.classList.add("side");
                    side.classList.add(`side-${si}`);
                    // side.innerHTML = si;
                    side.innerHTML = side_char[si];
                    side.innerHTML = `<span class="dice-number">${si}</span><span class="dice-path">${side_char[si]}</span>`;
                    
                    side.dataset.y = `${y}`;
                    side.dataset.x = `${x}`;
                    side.style = `--val: ${si}; --hue: ${si*60};`;
                    tile.appendChild(side);
                }


                row.appendChild(tile);
            }
            grid.appendChild(row);
        }
        return grid;
    }

    function floatDice(x,y){
        let tile = document.getElementById(`y${y},x${x}`);
        // console.log(`tile.val1: ${tile.dataset.val};`);

        let xVal = randomVal(360);
        let yVal = randomVal(360);
        let zVal = randomVal(360);
        tile.style = ` --rotate-x: ${xVal}deg; --rotate-y: ${yVal}deg; --rotate-z: ${zVal}deg;`;

        // let val = randomD6Val();
        // // console.log(`val: ${val};`);
        // if(val == tile.dataset.val){
        //     tile.dataset.val = ((val+1)%6)+1;
        // } else {
        //     tile.dataset.val = val;
        // }
        // console.log(`tile.val: ${tile.dataset.val};`);
        // // tile.innerHTML = val;
        // // tile.style = `--val: ${val}; --hue: ${val*60};`;
        // tile.style = ` --rotate-x: ${side_angle[tile.dataset.val].x}deg; --rotate-y: ${side_angle[tile.dataset.val].y}deg;`;
    }
    function resetNumber(x,y){
        let tile = document.getElementById(`y${y},x${x}`);
        // console.log(`tile.val1: ${tile.dataset.val};`);
        let val = randomD6Val();
        // console.log(`val: ${val};`);
        if(val == tile.dataset.val){
            tile.dataset.val = ((val+1)%6)+1;
        } else {
            tile.dataset.val = val;
        }
        console.log(`tile.val: ${tile.dataset.val};`);
        // tile.innerHTML = val;
        // tile.style = `--val: ${val}; --hue: ${val*60};`;
        tile.style = ` --rotate-x: ${side_angle[tile.dataset.val].x}deg; --rotate-y: ${side_angle[tile.dataset.val].y}deg; --rotate-z: 0deg;`;
    }
    function setNumber(x,y,n=1){
        let tile = document.getElementById(`y${y},x${x}`);
        // console.log(`tile.val1: ${tile.dataset.val};`);
        tile.dataset.val = n;
        // let val = randomD6Val();
        // // console.log(`val: ${val};`);
        // if(val == tile.dataset.val){
        //     tile.dataset.val = ((val+1)%6)+1;
        // } else {
        //     tile.dataset.val = val;
        // }
        // console.log(`tile.val: ${tile.dataset.val};`);
        // // tile.innerHTML = val;
        // // tile.style = `--val: ${val}; --hue: ${val*60};`;
        tile.style = ` --rotate-x: ${side_angle[tile.dataset.val].x}deg; --rotate-y: ${side_angle[tile.dataset.val].y}deg;`;
    }

    function resetNumber2(x,y){
        let tile = document.getElementById(`y${y},x${x}`);
        // console.log(`tile.val1: ${tile.dataset.val};`);

        let xVal = randomVal(360);
        let yVal = randomVal(360);
        let zVal = randomVal(360);
        tile.style = ` --rotate-x: ${xVal}deg; --rotate-y: ${yVal}deg; --rotate-z: ${zVal}deg;`;

        setTimeout(() => {
            let val = randomD6Val();
            // // console.log(`val: ${val};`);
            // if(val == tile.dataset.val){
            //     tile.dataset.val = ((val+1)%6)+1;
            // } else {
            //     tile.dataset.val = val;
            // }
            tile.dataset.val = val;
            console.log(`tile.val: ${tile.dataset.val};`);
            // tile.innerHTML = val;
            // tile.style = `--val: ${val}; --hue: ${val*60};`;
            tile.style = ` --rotate-x: ${side_angle[tile.dataset.val].x}deg; --rotate-y: ${side_angle[tile.dataset.val].y}deg; --rotate-z: 0deg;`;
        }, 200);
    }


    function crossResetNumber_safe(x,y){
        let xx = parseInt(x);
        let yy = parseInt(y);
        resetNumber(xx,yy);
        setTimeout(() => {
            resetNumber_safe(xx + 1, yy);
            resetNumber_safe(xx - 1, yy);
            resetNumber_safe(xx, yy + 1);
            resetNumber_safe(xx, yy - 1);
        }, 300);
    }
    function resetNumber_safe(x,y){
        console.log(`x: ${x}, y: ${y}`);
        if(x > -1 && y > -1 && x < smap.w && y < smap.h){
            let tile = document.getElementById(`y${y},x${x}`);
            let val = randomD6Val();
            tile.innerHTML = val;
            tile.dataset.val = val;
            tile.style = `--val: ${val}; --hue: ${val*60};`;
        }
    }


    function ReRollAll(){
        for (let y = 0; y < smap.h; y++) {
            for (let x = 0; x < smap.w; x++) {
                // let tile = document.getElementById(`y${y},x${x}`);
                resetNumber(x,y);
            }
        }
    }
    function ReSetAll(){
        for (let y = 0; y < smap.h; y++) {
            for (let x = 0; x < smap.w; x++) {
                // let tile = document.getElementById(`y${y},x${x}`);
                setNumber(x,y,1);
            }
        }
    }
    function FloatAll(){
        for (let y = 0; y < smap.h; y++) {
            for (let x = 0; x < smap.w; x++) {
                floatDice(x,y,1);
            }
        }
    }

    /* ─── Events ─── */
    function updateSettings(){
        s.h = window.innerHeight;
        s.w = window.innerWidth;
        s.dim = Math.sqrt(s.h * s.h + s.w * s.w);

        /* ─ Canvas ─ */
        s.canvas.x = s.w;
        s.canvas.y = s.h;
        s.canvas.z = (s.h + s.w)/2;

        s.canvas.x2 = s.canvas.x/2;
        s.canvas.y2 = s.canvas.y/2;
        s.canvas.z2 = s.canvas.z/2;

        /* ─ Box ─ */
        /* resize box for mobile */
        if(s.h < s.box.y) {s.box.y = s.h;}
        if(s.w < s.box.x) {s.box.x = s.w;}
        s.box.z = (s.box.y + s.box.x)/2;

        /* center box */
        s.box.top = (s.h - s.box.y)/2;
        s.box.left = (s.w - s.box.x)/2;

        /* determine center */
        s.box.x2 = s.box.left + (s.box.x / 2);
        s.box.y2 = s.box.top + (s.box.y / 2);
        s.box.z2 = (s.box.z / 2);

        /* ─ Grid ─ */
        s.grid.cols = Math.floor(s.w / s.tile.w);
        s.grid.rows = Math.floor(s.h / s.tile.h);

        /* ─ Canvas Update ─ */
        // canvas.width = s.canvas.x;
        // canvas.height = s.canvas.y;
        // ctx.clearRect(0,0,canvas.width, canvas.height);
    }
    window.addEventListener('resize', () =>{
        updateSettings();
    });

    window.addEventListener('load', (ev) => {
        console.log(`Welcome to my Lab!`);
        updateSettings();
        // start();
        // update();

        let display = document.getElementById("display");
        display.appendChild(CreateDisplayMap(smap.w,smap.h));
    });
