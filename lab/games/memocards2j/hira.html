:root {
--a-step: 27;
--a-step: 26;
--sat: 100%;
--lum: 40%;
}

#display {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
}

.cardo {
position: relative;
height: 80px; width: 80px;
margin: 8px;
--c1: hsla(calc(var(--hue-1) * var(--a-step)), var(--sat), var(--lum), 1);
--c2: hsla(calc(var(--hue-2) * var(--a-step)), var(--sat), var(--lum), 1);
--c3: hsla(calc(var(--hue-3) * var(--a-step)), var(--sat), var(--lum), 1);
--c4: hsla(calc(var(--hue-4) * var(--a-step)), var(--sat), var(--lum), 1);
--c5: hsla(calc(var(--hue-5) * var(--a-step)), var(--sat), var(--lum), 1);
--c6: hsla(calc(var(--hue-6) * var(--a-step)), var(--sat), var(--lum), 1);

background-color: #fff;
display: flex; align-items: center; justify-content: center;
flex-direction: column;
border-radius: 8px;
}
.cardo::before {
content: "";
position: absolute; top: 50%; left: 50%;
height: 88px; width: 88px;
transform: translate(-50%, -50%);
background-image: linear-gradient(135deg, 
var(--c1) 16%, var(--c2) 16%, 
var(--c2) 33%, var(--c3) 33%, 
var(--c3) 50%, var(--c4) 50%, 
var(--c4) 66%, var(--c5) 66%, 
var(--c5) 82%, var(--c6) 82%,
var(--c6) 100%);
border-radius: 8px;
z-index: -1;
}
.alphabet {
font-size: 12px;
}

.hue-a {--hue-base: 1;}
.hue-b {--hue-base: 2;}

    .table, .row, .tile {
        display: flex;
        align-items: center; justify-content: center;

    .table {
        flex-direction: column;
        align-items: flex-start;

function CardMaking(list){
    // let displayList = document.createElement("div");
    let display = document.getElementById("display");
    for (let i = 0; i < list.length; i++) {
        const e = list[i];
        let q = e.q;
        let p = e.p;
        let qs = q.repeat(6);
        // if(q.length == 1) {qs = q.repeat(6);}
        if(q.length == 2) {qs = `${q[0].repeat(3)}${q[1].repeat(3)}`;}
        if(q.length == 3) {qs = `${q[0].repeat(2)}${q[1].repeat(2)}${q[2].repeat(2)}`;}
        let qa = qs.split("");
        let qai = qs.split("").map(e => {return e.charCodeAt(0)-96;});
        
        let cardo = document.createElement("div");
        cardo.classList.add("cardo");
        cardo.style = `
            --hue-1: ${qai[0]}; --hue-2: ${qai[1]}; 
            --hue-3: ${qai[2]}; --hue-4: ${qai[3]}; 
            --hue-5: ${qai[4]}; --hue-6: ${qai[5]};`;

        let alphabeto = document.createElement("div");
        alphabeto.classList.add("alphabeto");
        for (let j = 0; j < q.length; j++) {
            const e2 = q[j];
            let char = document.createElement("span");
            char.classList.add("char");
            char.classList.add(`hue-${e2}`);
            char.innerText = e2;
            alphabeto.appendChild(char);
        }
        cardo.appendChild(alphabeto);

        let hira = document.createElement("div");
        hira.classList.add("hira");
        hira.innerText = p;
        cardo.appendChild(hira);

        display.appendChild(cardo);
    }
    // <div class="cardo" style="

}

function MakeHiraTable(t = hiratable){
    // hiratable
    let ttable = document.createElement('div');
    ttable.classList.add("table");
    for (let row_index = 0; row_index < t.length; row_index++) {
        const erow = t[row_index];
        let trow = document.createElement('div');
        trow.classList.add("row");
        
        for (let tile_index = 0; tile_index < erow.length; tile_index++) {
            const etile = erow[tile_index];
            let tile = document.createElement('div');
            tile.classList.add("tile");
            tile.innerText = etile;
            let cca = etile.charCodeAt(0);
            tile.dataset.cca = etile.charCodeAt(0);
            if(cca > 12000){
                tile.dataset.hue = Math.floor((cca - 12354) * 4);
            } else {
                tile.dataset.hue = Math.floor((cca - 65) * 12);
                tile.dataset.alp = true;
            }
            tile.style = `--tile-hue: ${tile.dataset.hue};`;
            trow.appendChild(tile);
        }
        ttable.appendChild(trow);
    }
    return ttable;
}

function SortKanji(k){
    let klist = k.split("\n").join("").split("");
    let wlist = document.createElement('div');
    wlist.classList.add("wlist");
    for (let i = 0; i < klist.length; i++) {
        const e = klist[i];
        let tile = document.createElement('div');
        tile.classList.add("tile");
        tile.innerText = e;
        wlist.appendChild(tile);
    }
    return wlist;
}
